<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Bank & Stock Market — Season 2</title>

<style>
:root{
  --bg:#070b16;
  --panel:#101827;
  --line:#26344d;
  --text:#f7f9ff;
  --muted:#91a0b8;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --purple:#7c3aed;
  --gold:#a16207;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{font:inherit}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button:hover{filter:brightness(1.1)}
button.secondary{background:#334155}
button.danger{background:var(--red)}
button.gold{background:var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}

input{
  background:#0b1220;
  color:white;
  border:1px solid #334155;
  border-radius:9px;
  padding:9px 10px;
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
}

aside{
  background:#0b1220;
  border-right:1px solid var(--line);
  padding:18px;
}

.logo{
  font-size:20px;
  font-weight:900;
  line-height:1.1;
  margin-bottom:15px;
}

.logo small{
  font-size:11px;
  color:#93c5fd;
}

.nav button{
  width:100%;
  text-align:left;
  background:transparent;
  color:#cbd5e1;
  margin:4px 0;
}

.nav button.active,
.nav button:hover{
  background:#172235;
  color:white;
}

main{
  padding:20px;
  max-width:1500px;
  width:100%;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.player{
  display:flex;
  gap:7px;
  align-items:center;
}

.hero{
  background:linear-gradient(135deg,#101827,#1b2751);
  border:1px solid #334155;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}

.muted{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
}

.big{
  font-size:27px;
  font-weight:900;
}

.hidden{display:none!important}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid #20304a;
  text-align:left;
}

th{
  color:#93c5fd;
  font-size:12px;
}

tr:last-child td{border-bottom:0}

.green{color:#4ade80}
.red{color:#f87171}
.purple{color:#c4b5fd}

.feed{
  max-height:280px;
  overflow:auto;
}

.feed-item{
  padding:9px 0;
  border-bottom:1px solid #223049;
}

.statline{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.event-card{
  border-color:#6d28d9;
  background:linear-gradient(135deg,#1d1647,#111827);
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#0f172a;
  border:1px solid #334155;
  padding:12px 15px;
  border-radius:10px;
  z-index:50;
}

.sell-box{
  margin-top:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.sell-box input{width:110px}

.pay-list{
  max-height:360px;
  overflow:auto;
}

.player-row{
  padding:11px;
  border:1px solid #26344d;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
  background:#0b1220;
}

.player-row:hover{
  background:#172235;
}

@media(max-width:1050px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{grid-template-columns:200px 1fr}
}

@media(max-width:720px){
  .app{grid-template-columns:1fr}
  aside{position:static}
  .grid,.grid2,.grid3{grid-template-columns:1fr}
}
</style>
</head>

   ========================================================= */

const supabaseClient=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY

const SAVE_KEY="empire_bank_s2_full_v1";

if(!multiplayerId){
  multiplayerId=crypto.randomUUID();
  localStorage.setItem(PLAYER_ID_KEY,multiplayerId);

function multiplayerStatus(text,ok=false){

  const el=document.getElementById("mpStatus");

  if(el){
    el.textContent=text;
    el.style.color=ok?"#4ade80":"#fbbf24";
  }

/* =========================================================
   MULTIPLAYER LOAD
   ========================================================= */

async function loadMultiplayerPlayer(){

  multiplayerStatus("Connecting...");

  const {data,error}=await supabaseClient
    .from("players")
    .select("id,username,game_state")
    .eq("id",multiplayerId)
    .maybeSingle();

  if(error){

    console.error("SUPABASE ERROR:",error);

    multiplayerStatus(
      "DB: "+(error.message||"Unknown error")
    );

    return;
  }

  if(data && data.game_state){

    try{

      applyingRemoteState=true;

      state=mergeDefaults(data.game_state);

      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(state)
      );

    }catch(e){

      console.error("Remote state error:",e);

    }finally{

      applyingRemoteState=false;

    }

  }else{

    await pushMultiplayerState();

  }

  multiplayerReady=true;

  multiplayerStatus(
    "🟢 Multiplayer connected",
    true
  );

  if(multiplayerChannel){
    try{
      await supabaseClient.removeChannel(multiplayerChannel);
    }catch(e){}
  }

  multiplayerChannel=supabaseClient
    .channel("empire-bank-players")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"players"
      },
      payload=>{

        if(
          payload.new &&
          payload.new.id===multiplayerId &&
          !applyingRemoteState
        ){

          if(payload.new.game_state){

            applyingRemoteState=true;

            state=mergeDefaults(
              payload.new.game_state
            );

            localStorage.setItem(
              SAVE_KEY,
              JSON.stringify(state)
            );

            renderAll();

            applyingRemoteState=false;
          }
        }

        renderOnlinePlayers();

      }
    )

    .subscribe(status=>{

      console.log("Realtime status:",status);

    });

  renderOnlinePlayers();
}

/* =========================================================
   MULTIPLAYER SAVE
   ========================================================= */

async function pushMultiplayerState(){

  if(applyingRemoteState) return;

  const row={
    id:multiplayerId,
    username:state.player || "Noone",
    game_state:state,
    updated_at:new Date().toISOString()
  };

  const {error}=await supabaseClient
    .from("players")
    .upsert(
      row,
      {onConflict:"id"}
    );

  if(error){

    console.error(
      "Multiplayer save failed:",
      error
    );

    multiplayerStatus(
      "DB: "+(error.message||"Save failed")
    );

  }else{

    multiplayerStatus(
      "🟢 Multiplayer connected",
      true
    );

  }
}

/*
   IMPORTANT:
   There is only ONE save() function in this version.
   This prevents the old local-only save() from
   overwriting the multiplayer save().
*/

function save(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );

  if(
    multiplayerReady &&
    !applyingRemoteState
  ){

    clearTimeout(multiplayerSaveTimer);

    multiplayerSaveTimer=setTimeout(()=>{
      pushMultiplayerState();
    },250);

  }
}

/* =========================================================
   ONLINE PLAYERS
   ========================================================= */

async function renderOnlinePlayers(){

  const el=document.getElementById("onlinePlayers");

  if(!el) return;

  const {data,error}=await supabaseClient
    .from("players")
    .select("id,username,updated_at")
    .order("updated_at",{ascending:false})
    .limit(30);

  if(error){

    console.error("Player list error:",error);

    el.innerHTML=
      '<span class="muted">Could not load players: '+
      esc(error.message||"Database error")+
      '</span>';

    return;
  }

  const now=Date.now();

  const recent=(data||[]).filter(p=>{

    const t=Date.parse(
      p.updated_at||""
    );

    return Number.isFinite(t) &&
      now-t<120000;

  });

  el.innerHTML=recent.length

    ?recent.map(p=>`

      <div
        class="player-row"
        onclick="selectFriend('${esc(p.username||"Noone")}')"
      >

        <div class="statline">

          <span>
            ${p.id===multiplayerId?"🟢 ":"👤 "}
            <b>${esc(p.username||"Noone")}</b>
          </span>

          <small class="muted">
            ${p.id===multiplayerId?"You":"Online"}
          </small>

        </div>

      </div>

    `).join("")

    :

    '<span class="muted">No other active players yet.</span>';
}

async function startMultiplayer(){

  try{

    await loadMultiplayerPlayer();

  }catch(e){

    console.error(e);

    multiplayerStatus(
      "⚠️ Connection failed"
    );

  }

}

return{

player:"Noone",

bank:0,

bankFee:0.01,

loan:{

let state=load();

function load(){

try{

const x=JSON.parse(
localStorage.getItem(SAVE_KEY)
);

return x
  ?mergeDefaults(x)
  :freshState();

}catch{

return freshState();

}

}

function mergeDefaults(x){

const d=freshState();

const out={

...d,
...x,

loan:{
...d.loan,
...(x.loan||{})
},

stats:{
...d.stats,
...(x.stats||{})
},

inventory:{
...d.inventory,
...(x.inventory||{})
},

collectibles:{
...d.collectibles,
...(x.collectibles||{})
},

roles:{
...d.roles,
...(x.roles||{})
},

events:{
...d.events,
...(x.events||{})
},

factories:{
...(x.factories||{})
},

shares:{
...(x.shares||{})
},

marketValues:{
...(x.marketValues||{})
},

coupons:{
...(x.coupons||{})
},

news:Array.isArray(x.news)
  ?x.news
  :d.news,

auctionBids:Array.isArray(x.auctionBids)
  ?x.auctionBids
  :d.auctionBids,

auctionWinners:Array.isArray(x.auctionWinners)
  ?x.auctionWinners
  :[]

};

if((out.inventory.Coal||0)>0){

out.collectibles.Coal+=
(out.inventory.Coal||0);

out.inventory.Coal=0;

}

if((out.inventory.Diamond||0)>0){

out.collectibles.Diamond+=
(out.inventory.Diamond||0);

out.inventory.Diamond=0;

}

out.loan=out.loan||{};
out.loan.amount=Math.max(0,Number(out.loan.amount)||0);
out.loan.balance=Math.max(0,Number(out.loan.balance)||0);
out.loan.lastPayment=Math.max(0,Number(out.loan.lastPayment)||0);
out.loan.totalPaid=Math.max(0,Number(out.loan.totalPaid)||0);

return out;

}

/* =========================================================
   HELPERS
   ========================================================= */

function money(n){

return new Intl.NumberFormat(
"en-US",
{
maximumFractionDigits:0
}
).format(
Math.max(0,Math.floor(n))
)+"💵";

}

function compact(n){

if(n>=1e9)
return(n/1e9).toFixed(2)+"B";

if(n>=1e6)
return(n/1e6).toFixed(1)+"M";

if(n>=1e3)
return(n/1e3).toFixed(1)+"K";

return Math.floor(n).toString();

}

function toast(msg){

const r=
document.getElementById(
"toastRoot"
);

r.innerHTML=
`<div class="toast">${msg}</div>`;

setTimeout(
()=>r.innerHTML="",
2200
);

}

function news(text){

state.news.unshift({

text:text,
time:new Date().toLocaleTimeString()

});

state.news=
state.news.slice(0,25);

save();

}

function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c])

);

}

/* =========================================================
   FACTORIES / WEALTH
   ========================================================= */

function totalFactoryIncome(){

return Object.entries(
state.factories
).reduce(
(a,[k,q])=>
a+
(FACTORIES[k]?.income||0)*q,
0
);

}

function totalFactoryValue(){

return Object.entries(
state.factories
).reduce(
(a,[k,q])=>
a+
(FACTORIES[k]?.price||0)*q,
0
);

}

function wealth(){

let total=
state.cash+
state.bank;

total+=
Object.entries(
state.shares
).reduce(
(a,[m,q])=>{

const market=
MARKETS.find(
x=>x.name===m
);

return a+
(
state.marketValues[m]||
market?.price||
0
)*q;

},
0
);

total+=
totalFactoryValue();

total+=
Object.values(
state.collectibles
).reduce(
(a,b)=>a+b*1000000,
0
);

total+=
Object.values(
state.inventory
).reduce(
(a,b)=>a+b*100000,
0
);

total+=
state.cosmetics.length*
500000;

return total;

}

function dailyTotal(){

return totalFactoryIncome();

}

function processDaily(){

const now=Date.now();

const day=86400000;

if(
now-state.lastDaily<day
){
return;
}

const days=
Math.floor(
(now-state.lastDaily)/day
);

const income=
dailyTotal()*days;

if(income>0){

news(
"🏦 Daily income received: "+
money(income)+
" ("+
days+
" game day"+
(days>1?"s":"")+
")."
);

state.cash+=income;

}

state.stats.days+=days;

state.lastDaily+=
days*day;

save();

}

async function sendMoneyToFriend(){

  if(!multiplayerReady){
    return toast("⏳ Multiplayer is not connected yet.");
  }

  const friendInput=document.getElementById("friendName");
  const amountInput=document.getElementById("friendAmount");

  const friendName=(friendInput?.value||"").trim();
  const amount=Math.floor(Number(amountInput?.value));

  if(!friendName){
    return toast("Enter your friend's player name.");
  }

  if(!Number.isFinite(amount)||amount<=0){
    return toast("Enter a valid amount.");
  }

  if(amount>state.cash){
    return toast("❌ You don't have enough cash.");
  }

  if(friendName.toLowerCase()===state.player.trim().toLowerCase()){
    return toast("❌ You cannot pay yourself.");
  }

  multiplayerStatus("Finding player...");

  /*
    IMPORTANT:
    We do NOT remove the sender's money until the receiver
    has successfully been updated.
  */

  const {data:players,error:findError}=await supabaseClient
    .from("players")
    .select("id,username,game_state")
    .ilike("username",friendName)
    .limit(10);

  if(findError){
    console.error("Find receiver error:",findError);
    multiplayerStatus("🟢 Multiplayer connected",true);
    return toast("❌ Database error: "+(findError.message||"Unknown error"));
  }

  const receiver=(players||[]).find(
    p=>String(p.username||"").trim().toLowerCase()===friendName.toLowerCase()
  );

  if(!receiver){
    multiplayerStatus("🟢 Multiplayer connected",true);
    return toast("❌ Player '"+friendName+"' was not found.");
  }

  if(receiver.id===multiplayerId){
    multiplayerStatus("🟢 Multiplayer connected",true);
    return toast("❌ You cannot pay yourself.");
  }

  const receiverState=mergeDefaults(receiver.game_state||{});
  receiverState.cash=Math.max(0,Number(receiverState.cash)||0);

  receiverState.cash+=amount;

  receiverState.news=Array.isArray(receiverState.news)
    ?receiverState.news
    :[];

  receiverState.news.unshift({
    text:"💸 You received "+money(amount)+" from "+state.player+"!",
    time:new Date().toLocaleTimeString()
  });

  receiverState.news=receiverState.news.slice(0,25);

  multiplayerStatus("Sending money...");

  /*
    Update receiver FIRST.
    If this fails, sender loses NOTHING.
  */

  const {data:updatedReceiver,error:receiverError}=await supabaseClient
    .from("players")
    .update({
      game_state:receiverState,
      updated_at:new Date().toISOString()
    })
    .eq("id",receiver.id)
    .select("id,username,game_state")
    .single();

  if(receiverError){
    console.error("Receiver update error:",receiverError);
    multiplayerStatus("🟢 Multiplayer connected",true);
    return toast("❌ Money was NOT taken. Receiver update failed.");
  }

  /*
    Receiver was successfully updated.
    NOW remove money from sender and save sender.
  */

  state.cash-=amount;

  state.news.unshift({
    text:"💸 You sent "+money(amount)+" to "+receiver.username+".",
    time:new Date().toLocaleTimeString()
  });

  state.news=state.news.slice(0,25);

  const {error:senderError}=await supabaseClient
    .from("players")
    .update({
      username:state.player||"Noone",
      game_state:state,
      updated_at:new Date().toISOString()
    })
    .eq("id",multiplayerId);

  if(senderError){

    /*
      Sender save failed after receiver was paid.
      Try to undo the receiver payment so money isn't duplicated.
    */

    const rollbackState=mergeDefaults(
      updatedReceiver.game_state||{}
    );

    rollbackState.cash=Math.max(
      0,
      (Number(rollbackState.cash)||0)-amount
    );

    rollbackState.news=Array.isArray(rollbackState.news)
      ?rollbackState.news
      :[];

    rollbackState.news.unshift({
      text:"↩️ Payment from "+state.player+" was cancelled.",
      time:new Date().toLocaleTimeString()
    });

    await supabaseClient
      .from("players")
      .update({
        game_state:rollbackState,
        updated_at:new Date().toISOString()
      })
      .eq("id",receiver.id);

    state.cash+=amount;

    console.error("Sender update error:",senderError);
    multiplayerStatus("🟢 Multiplayer connected",true);

    return toast("❌ Payment failed. Your money was restored.");
  }

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );

  multiplayerStatus("🟢 Multiplayer connected",true);

  if(friendInput)friendInput.value="";
  if(amountInput)amountInput.value="";

  renderAll();
  renderOnlinePlayers();
  renderPayPlayerList();

  toast(
    "✅ Sent "+money(amount)+" to "+receiver.username+"!"
  );
}

const MAX_LOAN=100000000000;
const MIN_LOAN=1;
const LOAN_RATE=0.05;
const LOAN_INTERVAL=3600000;

function activeLoan(){
return Number(state.loan?.balance||0)>0;
}

function loanPaymentAmount(){
const balance=Math.max(0,Number(state.loan?.balance)||0);
if(balance<=0)return 0;
return Math.max(1,Math.ceil(balance*LOAN_RATE));
}

function formatDuration(ms){
ms=Math.max(0,Math.floor(ms));
const totalSeconds=Math.ceil(ms/1000);
const hours=Math.floor(totalSeconds/3600);
const minutes=Math.floor((totalSeconds%3600)/60);
const seconds=totalSeconds%60;
if(hours>0)return hours+"h "+minutes+"m "+seconds+"s";
return minutes+"m "+seconds+"s";
}

function processLoanPayments(){
if(!activeLoan())return;

if(!state.loan.lastPayment){
state.loan.lastPayment=Date.now();
save();
return;
}

const now=Date.now();
const elapsed=now-state.loan.lastPayment;
if(elapsed<LOAN_INTERVAL)return;

const hours=Math.floor(elapsed/LOAN_INTERVAL);
state.loan.lastPayment+=hours*LOAN_INTERVAL;

let changed=false;

for(let i=0;i<hours && activeLoan();i++){
const payment=loanPaymentAmount();
const bankAvailable=Math.max(0,Number(state.bank)||0);
const taken=Math.min(payment,bankAvailable);

if(taken>0){
state.bank-=taken;
state.loan.balance=Math.max(0,state.loan.balance-taken);
state.loan.totalPaid=(Number(state.loan.totalPaid)||0)+taken;
changed=true;

news(
"🏦 Loan payment: "+money(taken)+
" was taken from your bank. Remaining debt: "+
 money(state.loan.balance)+"."
);
}

if(taken<payment){
news(
"⚠️ Loan payment due: "+money(payment)+
". Your bank only had "+money(taken)+
" available. The remaining debt stays active."
);
changed=true;
}

if(state.loan.balance<=0){
state.loan.balance=0;
state.loan.amount=0;
state.loan.lastPayment=0;
news("🎉 Loan fully repaid! You can borrow again.");
break;
}
}

if(changed)save();
}

if(activeLoan()){
